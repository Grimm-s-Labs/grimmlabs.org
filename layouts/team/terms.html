{{ partial "header.html" . }}

<div class="contents">

    <div class="page-title">team</div>
    <div class="page-sub">the people behind the lab</div>

    <hr class="rule">

    <div class="team-grid">
        {{ range where .Site.Pages "Section" "team" }}
        {{ if ne .Kind "taxonomy" }}
        <div class="team-card">
            {{ if .Params.avatar }}
            <a href="{{ .Permalink }}"><img src="{{ .Params.avatar }}" alt="{{ .Title }}"></a>
            {{ else }}
            <div style="width:100px;height:100px;border-radius:50%;background:var(--c-block-bg);border:1px solid var(--c-rule);margin:0 auto .5em;"></div>
            {{ end }}
            <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
            <div class="role">{{ .Params.role | default "researcher" }}</div>
        </div>
        {{ end }}
        {{ end }}
    </div>

</div>

{{ partial "footer.html" . }}
