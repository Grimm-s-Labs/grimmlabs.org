<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <link rel="icon" href="{{ "favicon.ico" | relURL }}">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>

<nav class="topbar">
    <a href="/" style="color: var(--c-accent); font-weight: 700; text-decoration: none;">~grimm</a>
    {{ range .Site.Menus.main }}
    <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
</nav>

{{ if .IsHome }}
<div class="banner-area">
    <img src="{{ "images/Grimm.png" | relURL }}" alt="Grimm Labs">
    <div class="banner-sub">experimental software laboratory <span style="color:var(--c-rule);">·</span> art by <a href="https://vgen.co/yoruneart" target="_blank">@yoruneart</a></div>
</div>
{{ end }}
